version: '3.8'

services:
  whatygo:
    image: ghcr.io/lucasgiovannibr/whatygo:latest
    networks:
      - network_public
    environment:
      # Servidor
      SERVER_PORT: 4000
      CLIENT_NAME: "whatygo"

      # Segurança (OBRIGATÓRIO)
      GLOBAL_API_KEY: "sua-chave-api-segura-aqui"

      # Banco de Dados PostgreSQL (RECOMENDADO)
      POSTGRES_AUTH_DB: "postgresql://postgres:senha@postgres:5432/whatygo_auth?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://postgres:senha@postgres:5432/whatygo_users?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "false"

      # Logs e Debug
      WADEBUG: "INFO"
      LOGTYPE: "console"
      LOG_DIRECTORY: "/app/logs"
      LOG_MAX_SIZE: "100"
      LOG_MAX_BACKUPS: "5"
      LOG_MAX_AGE: "30"
      LOG_COMPRESS: "true"

      # Conexão
      CONNECT_ON_STARTUP: "true"
      WEBHOOK_FILES: "true"

      # Sistema
      OS_NAME: "Linux"

      # Conversor de Áudio (Opcional)
      API_AUDIO_CONVERTER: ""
      API_AUDIO_CONVERTER_KEY: ""

      # Proxy (Opcional)
      PROXY_HOST: ""
      PROXY_PORT: ""
      PROXY_USERNAME: ""
      PROXY_PASSWORD: ""

      # RabbitMQ (Opcional)
      AMQP_URL: ""
      AMQP_GLOBAL_ENABLED: "false"
      AMQP_GLOBAL_EVENTS: ""

      # NATS (Opcional)
      NATS_URL: ""
      NATS_GLOBAL_ENABLED: "false"

      # Eventos
      EVENT_IGNORE_GROUP: "false"
      EVENT_IGNORE_STATUS: "true"

      # MinIO/S3 (Opcional)
      MINIO_ENABLED: "false"
      MINIO_ENDPOINT: ""
      MINIO_ACCESS_KEY: ""
      MINIO_SECRET_KEY: ""
      MINIO_BUCKET: ""
      MINIO_USE_SSL: "false"

    volumes:
      - whatygo_data:/app/dbdata
      - whatygo_logs:/app/logs

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        # Traefik Labels (ajuste conforme necessário)
        - traefik.enable=true
        - traefik.http.routers.whatygo.rule=Host(`whatygo.seudominio.com`)
        - traefik.http.routers.whatygo.entrypoints=websecure
        - traefik.http.routers.whatygo.tls.certresolver=letsencryptresolver
        - traefik.http.routers.whatygo.service=whatygo
        - traefik.http.services.whatygo.loadbalancer.server.port=4000
        - traefik.http.services.whatygo.loadbalancer.passHostHeader=true

volumes:
  whatygo_data:
    external: true
    name: whatygo_data
  whatygo_logs:
    external: true
    name: whatygo_logs

networks:
  network_public:
    external: true
    name: network_public
