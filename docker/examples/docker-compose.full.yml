# Exemplo completo: servidor + PostgreSQL + RabbitMQ + MinIO.
#
# Antes de subir, crie um arquivo ".env" ao lado deste (modelo em .env.example) com
#   GLOBAL_API_KEY=...     chave de administrador (openssl rand -hex 32)
#   POSTGRES_PASSWORD=...  senha do banco (inventada por você)
#   RABBITMQ_PASSWORD=...  senha do RabbitMQ (usuário "whatygo")
#   MINIO_PASSWORD=...     senha do MinIO (usuário "whatygo", mínimo 8 caracteres)
# O "docker compose up" recusa começar sem elas: não há senha padrão.
#
# As portas ficam presas ao próprio computador (127.0.0.1): quem acessa de fora é um proxy
# reverso com HTTPS. Para publicar a API direto, ponha BIND_ADDRESS=0.0.0.0 no .env.
services:
  whatygo:
    image: ghcr.io/lucasgiovannibr/whatygo:${IMAGE_TAG:-latest}
    container_name: whatygo
    restart: unless-stopped
    stop_grace_period: 30s # time to disconnect clients and flush queues on stop
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-4000}:4000"
    security_opt:
      - no-new-privileges:true
    # Limite de memória do contêiner (0 = sem limite). Com um limite, o servidor ajusta o coletor de
    # lixo do Go a 80 % dele (MEMORY_LIMIT_RATIO) para não ser morto por falta de memória numa
    # rajada de mídia. Exemplo: MEM_LIMIT=1g no .env
    mem_limit: ${MEM_LIMIT:-0}
    cap_drop:
      - ALL
    cap_add: # só o que o entrypoint usa para acertar os volumes e baixar os privilégios
      - CHOWN
      - SETUID
      - SETGID
    environment:
      # Servidor
      SERVER_PORT: 4000
      CLIENT_NAME: "whatygo"

      # Segurança
      GLOBAL_API_KEY: ${GLOBAL_API_KEY:?defina GLOBAL_API_KEY no arquivo .env}

      # Banco de Dados PostgreSQL
      POSTGRES_AUTH_DB: "postgresql://postgres:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}@postgres:5432/whatygo_auth?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/whatygo_users?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "true"

      # Logs e Debug
      WADEBUG: "INFO"
      LOGTYPE: "console"
      LOG_DIRECTORY: "/app/logs"
      LOG_MAX_SIZE: "100"
      LOG_MAX_BACKUPS: "5"
      LOG_MAX_AGE: "30"
      LOG_COMPRESS: "true"

      # Conexão
      CONNECT_ON_STARTUP: "false"
      WEBHOOK_FILES: "true"

      # Sistema
      OS_NAME: "Linux"

      # Webhook
      WEBHOOK_URL: "https://seu-webhook.com/endpoint"

      # RabbitMQ
      AMQP_URL: "amqp://whatygo:${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no arquivo .env}@rabbitmq:5672/default"
      AMQP_GLOBAL_ENABLED: "true"
      AMQP_GLOBAL_EVENTS: "MESSAGE,CONNECTION" # grupos de eventos (MESSAGE, SEND_MESSAGE, READ_RECEIPT, CONNECTION...)
      AMQP_SPECIFIC_EVENTS: ""

      # NATS
      NATS_URL: "nats://nats:4222"
      NATS_GLOBAL_ENABLED: "false"
      NATS_GLOBAL_EVENTS: ""

      # MinIO
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "whatygo"
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?defina MINIO_PASSWORD no arquivo .env}
      MINIO_BUCKET: "whatygo-media"
      MINIO_USE_SSL: "false"
      MINIO_REGION: "us-east-1"

      # Eventos
      EVENT_IGNORE_GROUP: "false"
      EVENT_IGNORE_STATUS: "true"

      # QR Code
      QRCODE_MAX_COUNT: "5"

      # Verificação de Usuário
      CHECK_USER_EXISTS: "true"

    volumes:
      - whatygo_data:/app/dbdata
      - whatygo_logs:/app/logs
    networks:
      - whatygo_network
    depends_on:
      - postgres
      - rabbitmq
      - minio

  postgres:
    image: postgres:15-alpine
    container_name: whatygo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432" # só este computador; apague o bloco "ports" se não precisar
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - whatygo_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: whatygo-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: whatygo
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no arquivo .env}
      RABBITMQ_DEFAULT_VHOST: default
    ports: # só este computador; apague o bloco se não precisar do painel/da fila de fora
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - whatygo_network

  minio:
    image: minio/minio:${MINIO_TAG:-latest}
    container_name: whatygo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: whatygo
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?defina MINIO_PASSWORD no arquivo .env}
    ports: # só este computador; apague o bloco se não precisar do console de fora
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - whatygo_network

volumes:
  whatygo_data:
    driver: local
  whatygo_logs:
    driver: local
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local

networks:
  whatygo_network:
    driver: bridge
