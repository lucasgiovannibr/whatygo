# Isolated test stack for WhatyGo (does NOT touch any other stack/volume).
# Needs a local image tagged whatygo:test (see README.md) and a .env next to this file.
# Usage:  docker compose -f docker/test-stack/docker-compose.yml up -d
# Manager: http://localhost:8100/manager   (global key is in docker/test-stack/.env)
#
# The project name below is kept on purpose: the volumes (and any paired WhatsApp number)
# are named after it, so changing it would start from an empty stack.
name: evofork-test

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  evolution-go:
    image: whatygo:test
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8100:8080"
    environment:
      SERVER_PORT: "8080"
      CLIENT_NAME: forktest
      GLOBAL_API_KEY: ${GLOBAL_API_KEY}
      POSTGRES_AUTH_DB: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      CONNECT_ON_STARTUP: "true"
      WADEBUG: INFO
      LOGTYPE: console
      OS_NAME: Fork Test
      PASSKEY_PUBLIC_URL: http://localhost:8100
      ENABLE_PPROF: "true"
      # media storage is not used in this test (values are only required to boot)
      MINIO_ENDPOINT: unused:9000
      MINIO_ACCESS_KEY: unused
      MINIO_SECRET_KEY: unused
      MINIO_BUCKET: unused
    volumes:
      - data:/app/dbdata
      - logs:/app/logs

volumes:
  pgdata:
  data:
  logs:
