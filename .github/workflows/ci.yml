name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    # Real brokers for the producer tests (they skip when these variables are unset).
    services:
      rabbitmq:
        image: rabbitmq:3
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      nats:
        image: nats:2
        ports: ["4222:4222"]
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AMQP_TEST_URL: amqp://guest:guest@localhost:5672/
      NATS_TEST_URL: nats://localhost:4222
      PG_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      # go.mod is the single source of truth for the toolchain version.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then echo "not gofmt-formatted:"; echo "$files"; exit 1; fi

      - run: go build ./...
      # go build never compiles _test.go files; vet does.
      - run: go vet ./...
      # -race is what catches the concurrent map / websocket write class of bugs.
      - run: go test -race ./...

      # Fails only on vulnerabilities the code can actually reach.
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  # Bugs and deprecated APIs (staticcheck SA*), dead code, ineffectual assignments: .golangci.yml
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # The manager panel (React): types, tests and a build that must still succeed.
  manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manager/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The audited tree is the production one: a vulnerable runtime dependency fails the build.
      - run: npm audit --omit=dev --audit-level=high

  # The image that is published: its OS packages and the Go binary's modules.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t whatygo:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: whatygo:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
